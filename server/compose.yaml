name: racefinder
services:
  preview:
    image: nginxinc/nginx-unprivileged@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    user: "101:101"
    tmpfs: ["/tmp:size=8m,noexec,nosuid,nodev"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    ports: ["127.0.0.1:8780:8080"]
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./preview.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [preview]
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
networks:
  preview:
    driver: bridge
