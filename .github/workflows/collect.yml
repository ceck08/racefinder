name: Aggiornamento catalogo

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Aggiorna races.json
        run: python collector/collect.py
      - name: Pubblica le modifiche
        run: |
          git config user.name "RaceFinder Collector"
          git config user.email "collector@racefinder.local"
          git add docs/races.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica al catalogo"
          else
            git commit -m "Catalogo aggiornato il $(date -u +%Y-%m-%d)"
            git push
          fi
